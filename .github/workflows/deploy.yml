name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# GITHUB_TOKEN permissions needed to publish to Pages. Nothing here needs a secret
# of its own — do not add one.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. In-progress runs finish rather than being cancelled, so a
# half-published site is never left live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      # Catches broken internal links, missing assets, duplicate titles, invalid
      # JSON-LD and a dropped CNAME before any of it reaches the live domain.
      - name: Audit the build
        run: npm run audit

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload build output
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
